name: Convert RBXL to RBXLX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Convert place file
        run: |
          cargo install rbxlx-convert
          rbxlx-convert input.rbxl output.rbxlx
